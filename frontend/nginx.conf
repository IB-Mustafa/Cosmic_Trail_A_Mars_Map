# nginx for the COSMIC TRAIL frontend container (see frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Look the backend up at request time through Docker's DNS, so nginx still starts
    # (and explains the problem) when the "backend" service isn't running or the container
    # was started without docker compose.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # Backend API (and its interactive docs), forwarded to the "backend" service.
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        # only for errors nginx itself raises (backend unreachable); the backend's own
        # error responses pass through unchanged
        error_page 502 504 = @backend_down;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # very long routes and ARIA answers can take a while
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"detail":"The COSMIC TRAIL backend is not reachable from the frontend container. Start the whole app from the project folder with: docker compose up (do not start the images one by one)."}';
    }

    # Hashed build output never changes: cache it for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cesium's workers, assets and widgets (copied by vite-plugin-cesium).
    location /cesium/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
