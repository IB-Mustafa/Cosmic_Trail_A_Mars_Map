# nginx for the COSMIC TRAIL frontend container (see frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Backend API (and its interactive docs), forwarded to the "backend" service.
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # very long routes and ARIA answers can take a while
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # Hashed build output never changes: cache it for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cesium's workers, assets and widgets (copied by vite-plugin-cesium).
    location /cesium/ {
        expires 7d;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
